services:
  coevo:
    build:
      context: .
      args:
        COEVO_BASE_IMAGE: ${COEVO_BASE_IMAGE:-meinian-megatron-grpo:swift4.1.3-vllm0.19.1-trl0.29.1-mcore1.3.2@sha256:8c0641fd72cf18cc32ba439ed7a1fadf3fe6d5bf54cc42929c677d7cd63f4163}
    image: ${COEVO_RUNTIME_IMAGE:-coevo-swift:4.1.3}
    container_name: swift-grpo-dev
    working_dir: /workspace/OPD/correctability_coevolution
    command: sleep infinity
    network_mode: host
    ipc: host
    shm_size: 64gb
    gpus: all
    env_file:
      - path: .env
        required: false
    environment:
      COEVO_ROOT: /workspace/OPD/correctability_coevolution
      COEVO_TAU2_SRC: /workspace/OPD/third_party/tau2-bench/src
      TAU2_DATA_DIR: /workspace/OPD/third_party/tau2-bench/data
      PYTHONPATH: /workspace/OPD/correctability_coevolution:/workspace/OPD/third_party/tau2-bench/src
      COEVO_MODEL_ROOT: /models
      COEVO_TEACHER_PATH: /models/teacher
      COEVO_STUDENT_PATH: /models/student
      COEVO_BUYER_PATH: /models/student
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
    volumes:
      - .:/workspace/OPD
      - ${COEVO_TEACHER_MODEL_DIR:?Set COEVO_TEACHER_MODEL_DIR in .env}:/models/teacher:ro
      - ${COEVO_STUDENT_MODEL_DIR:?Set COEVO_STUDENT_MODEL_DIR in .env}:/models/student:ro
