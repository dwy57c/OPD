[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "correctability-coevolution"
version = "0.1.0"
description = "Correctability-driven environment-student co-evolution infrastructure"
requires-python = ">=3.10,<3.13"
dependencies = [
  "openai>=1.75,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.setuptools]
package-dir = {"" = "correctability_coevolution"}

[tool.setuptools.packages.find]
where = ["correctability_coevolution"]
include = ["coevo*"]

[tool.pytest.ini_options]
testpaths = ["correctability_coevolution/tests"]
pythonpath = ["correctability_coevolution"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
